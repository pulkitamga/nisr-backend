<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0b1520"/>
      <stop offset="50%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>

    <!-- Polished surface gradient -->
    <radialGradient id="polishSurface" cx="0.35" cy="0.4" r="0.65">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="40%" stop-color="#12202e"/>
      <stop offset="100%" stop-color="#080f1e"/>
    </radialGradient>

    <!-- Terminal metallic gradient -->
    <radialGradient id="terminalTop" cx="0.45" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#4a5a6a"/>
      <stop offset="30%" stop-color="#3a4a5a"/>
      <stop offset="70%" stop-color="#2a3a4a"/>
      <stop offset="100%" stop-color="#1a2a3a"/>
    </radialGradient>

    <!-- Terminal side -->
    <linearGradient id="terminalSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="40%" stop-color="#2a3848"/>
      <stop offset="100%" stop-color="#1a2a3a"/>
    </linearGradient>

    <!-- Teal key light -->
    <radialGradient id="keyLight" cx="0.2" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#239e92" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#239e92" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#239e92" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim highlight -->
    <linearGradient id="rimHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#239e92" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#239e92" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#239e92" stop-opacity="0"/>
      <stop offset="100%" stop-color="#239e92" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Copper accent warm -->
    <radialGradient id="copperWarm" cx="0.7" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#c87941" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c87941" stop-opacity="0"/>
    </radialGradient>

    <!-- Machined surface pattern -->
    <pattern id="machined" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <circle cx="3" cy="3" r="0.4" fill="#fff" fill-opacity="0.02"/>
    </pattern>

    <!-- Fine concentric rings -->
    <pattern id="rings" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="10" fill="none" stroke="#fff" stroke-opacity="0.01" stroke-width="0.3"/>
      <circle cx="50" cy="50" r="20" fill="none" stroke="#fff" stroke-opacity="0.01" stroke-width="0.3"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-opacity="0.01" stroke-width="0.3"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-opacity="0.01" stroke-width="0.3"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="rimGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.137  0 0 0 0 0.62  0 0 0 0 0.57  0 0 0 0.6 0"/>
    </filter>

    <!-- Deep shadow -->
    <filter id="deepShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30" result="blur"/>
      <feOffset dx="5" dy="20" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Specular highlight -->
    <radialGradient id="specular" cx="0.3" cy="0.25" r="0.3">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg3)"/>

  <!-- Polished surface area -->
  <rect width="1920" height="1080" fill="url(#polishSurface)"/>

  <!-- Machined texture -->
  <rect width="1920" height="1080" fill="url(#machined)"/>

  <!-- Teal key light from upper-left -->
  <rect width="1920" height="1080" fill="url(#keyLight)"/>

  <!-- Copper warm accent -->
  <ellipse cx="1350" cy="540" rx="500" ry="400" fill="url(#copperWarm)"/>

  <!-- Concentric ring texture (macro feel) -->
  <rect width="1920" height="1080" fill="url(#rings)" opacity="0.5"/>

  <!-- ═══ BATTERY TERMINAL CLOSE-UP ═══ -->
  <g filter="url(#deepShadow)" transform="translate(850, 200)">

    <!-- Main terminal body (cylindrical top-down perspective) -->
    <!-- Outer ring -->
    <ellipse cx="140" cy="180" rx="180" ry="60" fill="#1a2a3a"/>
    <ellipse cx="140" cy="180" rx="180" ry="60" fill="none" stroke="#239e92" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Teal rim glow -->
    <ellipse cx="140" cy="180" rx="183" ry="63" fill="none" stroke="#239e92" stroke-opacity="0.06" stroke-width="8" filter="url(#rimGlow3)"/>

    <!-- Inner ring -->
    <ellipse cx="140" cy="180" rx="140" ry="46" fill="url(#terminalTop)"/>
    <!-- Machined texture on terminal -->
    <ellipse cx="140" cy="180" rx="140" ry="46" fill="url(#machined)"/>
    <!-- Specular highlight -->
    <ellipse cx="100" cy="165" rx="70" ry="25" fill="url(#specular)"/>

    <!-- Center post -->
    <ellipse cx="140" cy="180" rx="50" ry="18" fill="url(#terminalSide)"/>
    <ellipse cx="140" cy="180" rx="50" ry="18" fill="url(#machined)"/>
    <!-- Center post highlight -->
    <ellipse cx="128" cy="174" rx="25" ry="9" fill="#fff" fill-opacity="0.05"/>

    <!-- Terminal connection point -->
    <rect x="130" y="110" width="20" height="30" rx="4" fill="#3a4a5a"/>
    <rect x="132" y="112" width="16" height="6" rx="2" fill="#fff" fill-opacity="0.08"/>

    <!-- Fine measurement engravings -->
    <g stroke="#239e92" stroke-opacity="0.08" stroke-width="0.4">
      <!-- Tick marks around outer ring -->
      <line x1="140" y1="122" x2="140" y2="128"/>
      <line x1="100" y1="124" x2="103" y2="130"/>
      <line x1="180" y1="124" x2="177" y2="130"/>
      <line x1="60" y1="145" x2="66" y2="148"/>
      <line x1="220" y1="145" x2="214" y2="148"/>
      <line x1="50" y1="170" x2="56" y2="170"/>
      <line x1="230" y1="170" x2="224" y2="170"/>
      <line x1="60" y1="200" x2="66" y2="197"/>
      <line x1="220" y1="200" x2="214" y2="197"/>
      <line x1="100" y1="225" x2="103" y2="220"/>
      <line x1="180" y1="225" x2="177" y2="220"/>
      <line x1="140" y1="235" x2="140" y2="230"/>
    </g>

    <!-- Fine concentric detail rings -->
    <ellipse cx="140" cy="180" rx="100" ry="33" fill="none" stroke="#fff" stroke-opacity="0.03" stroke-width="0.5"/>
    <ellipse cx="140" cy="180" rx="80" ry="26" fill="none" stroke="#fff" stroke-opacity="0.025" stroke-width="0.5"/>
    <ellipse cx="140" cy="180" rx="65" ry="22" fill="none" stroke="#fff" stroke-opacity="0.02" stroke-width="0.5"/>

    <!-- ═══ BATTERY BODY EDGE (below terminal) ═══ -->
    <!-- Battery top surface visible below terminal -->
    <path d="M-40,240 L-40,380 Q-40,390 -30,390 L310,390 Q320,390 320,380 L320,240 Z" fill="url(#indSurf)" opacity="0.8"/>
    <path d="M-40,240 L-40,380 Q-40,390 -30,390 L310,390 Q320,390 320,380 L320,240 Z" fill="url(#machined)"/>

    <!-- Brushed metal surface lines -->
    <g stroke="#fff" stroke-opacity="0.015" stroke-width="0.5">
      <line x1="-20" y1="260" x2="300" y2="260"/>
      <line x1="-20" y1="280" x2="300" y2="280"/>
      <line x1="-20" y1="300" x2="300" y2="300"/>
      <line x1="-20" y1="320" x2="300" y2="320"/>
      <line x1="-20" y1="340" x2="300" y2="340"/>
      <line x1="-20" y1="360" x2="300" y2="360"/>
      <line x1="-20" y1="380" x2="300" y2="380"/>
    </g>

    <!-- Brand marking on battery surface -->
    <rect x="40" y="290" width="70" height="20" rx="3" fill="#239e92" fill-opacity="0.1"/>
    <rect x="48" y="296" width="54" height="8" rx="2" fill="#239e92" fill-opacity="0.2"/>

    <!-- Battery edge highlight -->
    <line x1="-40" y1="240" x2="320" y2="240" stroke="#239e92" stroke-opacity="0.1" stroke-width="0.5"/>
    <line x1="-40" y1="390" x2="320" y2="390" stroke="#fff" stroke-opacity="0.03" stroke-width="0.5"/>
  </g>

  <!-- ═══ AMBIENT LIGHT RAYS ═══ -->
  <g opacity="0.4">
    <!-- Subtle light ray from upper left -->
    <polygon points="0,0 500,0 300,1080 0,1080" fill="#239e92" fill-opacity="0.015"/>
    <polygon points="0,0 300,0 100,1080 0,1080" fill="#239e92" fill-opacity="0.01"/>
  </g>

  <!-- ═══ DECORATIVE ELEMENTS ═══ -->
  <!-- Copper accent line -->
  <rect x="1380" y="80" width="1" height="920" fill="url(#copperLine3)" opacity="0.5"/>
  <linearGradient id="copperLine3" x1="0" y1="0" x2="0" y2="1" xmlns="http://www.w3.org/2000/svg">
    <stop offset="0%" stop-color="#c87941" stop-opacity="0"/>
    <stop offset="30%" stop-color="#c87941" stop-opacity="0.3"/>
    <stop offset="70%" stop-color="#c87941" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#c87941" stop-opacity="0"/>
  </linearGradient>

  <!-- Technical annotation lines -->
  <g stroke="#fff" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="1350" y1="250" x2="1450" y2="250"/>
    <line x1="1350" y1="270" x2="1450" y2="270"/>
    <line x1="1400" y1="250" x2="1400" y2="270"/>
  </g>

  <!-- Precision dots -->
  <circle cx="250" cy="200" r="1.5" fill="#239e92" fill-opacity="0.12"/>
  <circle cx="380" cy="350" r="1" fill="#fff" fill-opacity="0.06"/>
  <circle cx="1600" cy="300" r="2" fill="#c87941" fill-opacity="0.1"/>
  <circle cx="1700" cy="500" r="1.5" fill="#239e92" fill-opacity="0.08"/>
  <circle cx="1550" cy="750" r="1" fill="#fff" fill-opacity="0.05"/>
  <circle cx="180" cy="700" r="1.5" fill="#239e92" fill-opacity="0.1"/>

  <!-- Small measurement marks -->
  <g stroke="#239e92" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="1500" y1="400" x2="1500" y2="430"/>
    <line x1="1490" y1="400" x2="1510" y2="400"/>
    <line x1="1490" y1="430" x2="1510" y2="430"/>
  </g>

  <!-- Surface reflection pool -->
  <ellipse cx="990" cy="900" rx="400" ry="60" fill="#239e92" fill-opacity="0.02"/>
  <ellipse cx="990" cy="920" rx="300" ry="30" fill="#239e92" fill-opacity="0.015"/>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#bg3)" opacity="0.12"/>
</svg>
