<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <!-- Background: deep midnight to navy -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#080f1e"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>

    <!-- Battery body: dark graphite with subtle highlight -->
    <linearGradient id="batteryBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2a3444"/>
      <stop offset="25%" stop-color="#1e2a38"/>
      <stop offset="60%" stop-color="#182230"/>
      <stop offset="100%" stop-color="#111c2a"/>
    </linearGradient>

    <!-- Battery top face: lighter graphite -->
    <linearGradient id="batteryTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4a5e"/>
      <stop offset="100%" stop-color="#2a3848"/>
    </linearGradient>

    <!-- Battery side: darker shadow -->
    <linearGradient id="batterySide" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#141e2c"/>
      <stop offset="100%" stop-color="#1a2636"/>
    </linearGradient>

    <!-- Terminal: metallic silver -->
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8899aa"/>
      <stop offset="30%" stop-color="#a0b0c0"/>
      <stop offset="60%" stop-color="#7a8a9a"/>
      <stop offset="100%" stop-color="#6a7a8a"/>
    </linearGradient>

    <!-- Teal rim light gradient -->
    <radialGradient id="rimLight" cx="0.5" cy="0.5" r="0.6" fx="0.3" fy="0.3">
      <stop offset="0%" stop-color="#239e92" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#239e92" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#239e92" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal edge glow -->
    <linearGradient id="tealEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#239e92" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#239e92" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#239e92" stop-opacity="0"/>
    </linearGradient>

    <!-- Floor reflection gradient -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1825" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080f1e" stop-opacity="0"/>
    </linearGradient>

    <!-- Copper accent -->
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c87941" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c87941" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#c87941" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c87941" stop-opacity="0"/>
    </linearGradient>

    <!-- Surface reflection -->
    <linearGradient id="surfaceReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#239e92" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#239e92" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter for teal rim -->
    <filter id="tealGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.137  0 0 0 0 0.62  0 0 0 0 0.57  0 0 0 0.5 0"/>
    </filter>

    <!-- Soft shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur"/>
      <feOffset dx="8" dy="16" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Brushed metal pattern -->
    <pattern id="brushed" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#fff" stroke-opacity="0.03" stroke-width="0.5"/>
    </pattern>

    <!-- Fine grid pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <line x1="80" y1="0" x2="80" y2="80" stroke="#fff" stroke-opacity="0.015" stroke-width="0.5"/>
      <line x1="0" y1="80" x2="80" y2="80" stroke="#fff" stroke-opacity="0.015" stroke-width="0.5"/>
    </pattern>

    <!-- Ambient teal radial -->
    <radialGradient id="ambientTeal" cx="0.65" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#239e92" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#239e92" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Subtle grid texture -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Ambient teal atmosphere -->
  <ellipse cx="1250" cy="490" rx="600" ry="450" fill="url(#ambientTeal)"/>

  <!-- Copper accent line -->
  <rect x="1400" y="100" width="1" height="880" fill="url(#copper)"/>

  <!-- Horizontal accent lines -->
  <line x1="200" y1="280" x2="600" y2="280" stroke="#239e92" stroke-opacity="0.06" stroke-width="0.5"/>
  <line x1="200" y1="800" x2="500" y2="800" stroke="#239e92" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- Floor surface -->
  <ellipse cx="1100" cy="820" rx="500" ry="40" fill="url(#floor)"/>

  <!-- ═══ BATTERY GROUP ═══ -->
  <g filter="url(#shadow)" transform="translate(1050, 180)">

    <!-- Battery body: 3D perspective -->
    <!-- Front face -->
    <rect x="0" y="40" width="280" height="420" rx="8" fill="url(#batteryBody)"/>
    <rect x="0" y="40" width="280" height="420" rx="8" fill="url(#brushed)"/>

    <!-- Top face (3D depth) -->
    <path d="M8,40 L28,10 L308,10 L300,40 Z" fill="url(#batteryTop)"/>
    <path d="M8,40 L28,10 L308,10 L300,40 Z" fill="url(#brushed)"/>

    <!-- Right side face (3D depth) -->
    <path d="M280,48 L308,18 L308,438 L280,460 Z" fill="url(#batterySide)"/>

    <!-- Terminal posts -->
    <rect x="90" y="-10" width="36" height="22" rx="3" fill="url(#terminal)"/>
    <rect x="160" y="-10" width="36" height="22" rx="3" fill="url(#terminal)"/>
    <!-- Terminal highlights -->
    <rect x="92" y="-8" width="32" height="4" rx="2" fill="#fff" fill-opacity="0.15"/>
    <rect x="162" y="-8" width="32" height="4" rx="2" fill="#fff" fill-opacity="0.15"/>

    <!-- Battery label area -->
    <rect x="30" y="180" width="220" height="100" rx="4" fill="#0f1925" fill-opacity="0.5" stroke="#239e92" stroke-opacity="0.12" stroke-width="0.5"/>

    <!-- Label text lines -->
    <rect x="50" y="200" width="100" height="8" rx="2" fill="#fff" fill-opacity="0.15"/>
    <rect x="50" y="218" width="140" height="4" rx="2" fill="#fff" fill-opacity="0.06"/>
    <rect x="50" y="230" width="120" height="4" rx="2" fill="#fff" fill-opacity="0.06"/>
    <!-- NISR brand text -->
    <rect x="50" y="248" width="60" height="14" rx="2" fill="#239e92" fill-opacity="0.2"/>

    <!-- Side ventilation lines -->
    <line x1="15" y1="320" x2="15" y2="420" stroke="#fff" stroke-opacity="0.04" stroke-width="1.5"/>
    <line x1="25" y1="320" x2="25" y2="420" stroke="#fff" stroke-opacity="0.04" stroke-width="1.5"/>
    <line x1="35" y1="320" x2="35" y2="420" stroke="#fff" stroke-opacity="0.04" stroke-width="1.5"/>
    <line x1="245" y1="320" x2="245" y2="420" stroke="#fff" stroke-opacity="0.04" stroke-width="1.5"/>
    <line x1="255" y1="320" x2="255" y2="420" stroke="#fff" stroke-opacity="0.04" stroke-width="1.5"/>
    <line x1="265" y1="320" x2="265" y2="420" stroke="#fff" stroke-opacity="0.04" stroke-width="1.5"/>

    <!-- Teal rim light edges -->
    <rect x="0" y="40" width="280" height="420" rx="8" fill="none" stroke="#239e92" stroke-opacity="0.2" stroke-width="1.5"/>
    <path d="M8,40 L28,10 L308,10 L300,40 Z" fill="none" stroke="#239e92" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Rim glow effect -->
    <rect x="-4" y="36" width="288" height="428" rx="10" fill="none" stroke="#239e92" stroke-opacity="0.08" stroke-width="6" filter="url(#tealGlow)"/>

    <!-- Surface reflection on floor -->
    <ellipse cx="140" cy="500" rx="180" ry="30" fill="#239e92" fill-opacity="0.04"/>
  </g>

  <!-- Decorative elements -->
  <!-- Small floating dots -->
  <circle cx="750" cy="300" r="2" fill="#239e92" fill-opacity="0.15"/>
  <circle cx="820" cy="450" r="1.5" fill="#239e92" fill-opacity="0.1"/>
  <circle cx="700" cy="600" r="1" fill="#fff" fill-opacity="0.08"/>
  <circle cx="1600" cy="350" r="1.5" fill="#c87941" fill-opacity="0.12"/>
  <circle cx="1650" cy="500" r="1" fill="#239e92" fill-opacity="0.1"/>
  <circle cx="1550" cy="700" r="2" fill="#fff" fill-opacity="0.06"/>

  <!-- Technical measurement marks -->
  <g stroke="#fff" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="1380" y1="200" x2="1380" y2="250"/>
    <line x1="1370" y1="200" x2="1390" y2="200"/>
    <line x1="1370" y1="250" x2="1390" y2="250"/>
    <line x1="1450" y1="600" x2="1450" y2="650"/>
    <line x1="1440" y1="600" x2="1460" y2="600"/>
    <line x1="1440" y1="650" x2="1460" y2="650"/>
  </g>

  <!-- Subtle vignette overlay -->
  <rect width="1920" height="1080" fill="url(#bg)" opacity="0.15"/>
</svg>
